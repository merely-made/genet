    { crate = "icu_collections@1.5.0", reason = "icu_segmenter@1.5.0 require this older API line; the other resolved callers use 2.3.0." },
    { crate = "icu_provider@1.5.0", reason = "icu_segmenter@1.5.0 require this older API line; the other resolved callers use 2.3.1." },
    { crate = "icu_segmenter@1.5.0", reason = "webdriver@0.53.0 require this older API line; the other resolved callers use 2.3.0." },
    { crate = "icu_segmenter_data@1.5.1", reason = "icu_segmenter@1.5.0 require this older API line; the other resolved callers use 2.3.0." },
    { crate = "litemap@0.7.5", reason = "icu_locid@1.5.0 require this older API line; the other resolved callers use 0.8.3." },
    { crate = "miniz_oxide@0.8.9", reason = "exr@1.74.2, png@0.18.1 require this older API line; the other resolved callers use 0.9.1." },
