    { crate = "regress@0.11.1", reason = "genet-scripted-dom keeps its local 0.11.1 compatibility patch; Nova uses the independent registry 0.11.1 oracle, while Boa requires 0.12. Keep their sources separate." },
    { crate = "syn@2.0.119", reason = "arg_enum_proc_macro@0.3.4, asn1-rs-derive@0.5.1, asn1-rs-derive@0.6.0, asn1-rs-impl@0.2.0, and other recorded callers require this older API line; the other resolved callers use 3.0.6." },
