[package]
name = "genet-webrtc"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
rust-version = "1.97.1"
description = "Caller-driven native WebRTC host for Genet documents"

[dependencies]
genet-runtime = { path = "../script-runtime-api" }
# Independent wire leaf, not Murm's application carrier or root radio workspace.
murm-rtc = { git = "https://github.com/merely-made/murm.git", rev = "c58b70421d31ed9f2288dc44152dcb6d719552a9", default-features = false, features = ["crypto-ring", "host"] }
serde_json = { workspace = true }
bytes = "1"

[dev-dependencies]
script-engine-api = { path = "../script-engine-api" }
genet-bole = { path = "../script-engine-boa" }

[target.'cfg(target_pointer_width = "64")'.dev-dependencies]
genet-vano = { path = "../script-engine-nova" }
