    # new duplicate versions still fail. Keep independent engine oracles separate.
    { crate = "alloc-no-stdlib@2.0.4", reason = "brotli-decompressor@5.0.3 require this older API line; the other resolved callers use 3.0.0." },
    { crate = "asn1-rs@0.6.2", reason = "der-parser@9.0.0, oid-registry@0.7.1, x509-parser@0.16.0 require this older API line; the other resolved callers use 0.7.2." },
    { crate = "asn1-rs-derive@0.5.1", reason = "asn1-rs@0.6.2 require this older API line; the other resolved callers use 0.6.0." },
    { crate = "brotli-decompressor@5.0.3", reason = "wuff@0.2.9 require this older API line; the other resolved callers use 6.0.1." },
    { crate = "cpufeatures@0.2.17", reason = "aes@0.8.4, sha1@0.10.7 require this older API line; the other resolved callers use 0.3.1." },
    { crate = "der-parser@9.0.0", reason = "rtc-dtls@0.21.1 and x509-parser@0.16.0 require this older API line; x509-parser@0.18.1 uses 10.0.0." },
    { crate = "embedded-io@0.4.0", reason = "postcard@1.1.3 require this older API line; the other resolved callers use 0.6.1." },
    { crate = "fixedbitset@0.1.9", reason = "petgraph@0.4.13 require this older API line; the other resolved callers use 0.5.7." },
