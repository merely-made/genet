[package]
name = "murm-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"
description = "Host-selected one-hop HTTP and raw WebSocket wire engines"
[features]
default = ["http", "h3", "websocket"]
http = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:http-body-util"]
h3 = ["http", "dep:quinn", "dep:h3", "dep:h3-quinn", "dep:webpki-roots"]
websocket = ["dep:tokio", "dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots"]
[dependencies]
bytes = "1"
url = "2.5"
http = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"], optional = true }
hyper = { version = "1", features = ["client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["webpki-roots", "http1", "http2", "ring", "tls12"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
webpki-roots = { version = "1", optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
[dev-dependencies]
hyper = { version = "1", features = ["server", "http2"] }
tokio-rustls = "0.26"
rcgen = "0.14"
mockito = "1"
