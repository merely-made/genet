    { crate = "objc2-core-image@0.2.2", reason = "objc2-app-kit@0.2.2, objc2-ui-kit@0.2.2 require this older API line; the other resolved callers use 0.3.2." },
    { crate = "objc2-metal@0.2.2", reason = "objc2-core-image@0.2.2, objc2-quartz-core@0.2.2 require this older API line; the other resolved callers use 0.3.2." },
