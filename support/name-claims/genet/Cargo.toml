[package]
name = "genet"
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
description = "Genet: a data-oriented, modular Rust web engine built around tree diffing (the engine formerly known as serval). NAME CLAIM: the real project lives at github.com/merely-made/genet pending the repo rename; components are consumed as git dependencies."

[workspace]

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
