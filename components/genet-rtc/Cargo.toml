[package]
name = "murm-rtc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"
description = "Caller-driven WebRTC protocol and optional native UDP host adapter"
readme = "README.md"
# Git supplier until an upstream registry release includes the pinned fix.
publish = false

[features]
default = ["crypto-ring"]
crypto-ring = ["rtc/crypto-ring"]
crypto-aws-lc-rs = ["rtc/crypto-aws-lc-rs"]
host = ["dep:bytes", "dep:thiserror"]
dns = ["host", "dep:hickory-proto", "dep:getrandom", "dep:socket2", "dep:ipconfig", "dep:socket-pktinfo", "dep:network-interface"]
udp = ["host", "dep:tokio"]

[dependencies]
# Published 0.21.1 loses DCEP reliability on accepted channels. This exact
# supplier includes DCEP, bounded restart path/consent, continued DTLS role
# and recovery of exhausted checks after authenticated restart requests.
rtc = { git = "https://github.com/merely-made/rtc", rev = "ba8e3c46888fad49a3a6b0b6a46aaa5e711fafbb", default-features = false }
bytes = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"], optional = true }
getrandom = { version = "0.4", optional = true }
socket-pktinfo = { version = "=0.4.1", optional = true }
network-interface = { version = "2.0.5", optional = true }
socket2 = { version = "0.6", optional = true, features = ["all"] }

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", optional = true, features = ["rt", "net", "time", "macros"] }

[dev-dependencies]
bytes = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[lints]
workspace = true
