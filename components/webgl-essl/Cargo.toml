[package]
name = "genet-essl"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = true

rust-version = "1.97.1"
repository = "https://github.com/merely-made/genet"
description = "Pure-Rust ESSL frontend for Genet's WebGL: lexer, parser, checker and an ESSL to WGSL pipeline."

[lib]
name = "webgl_essl"
path = "lib.rs"

[dependencies]
# Step 6 lowering path A: ESSL -> SPIR-V (rspirv) -> naga IR (spv-in)
# -> WGSL (wgsl-out). Pinned to the naga that ships with wgpu 29.
naga = { version = "30", default-features = false, features = ["spv-in", "wgsl-in", "wgsl-out"] }
rspirv = "0.13"

[lints]
workspace = true
