    { crate = "oid-registry@0.7.1", reason = "x509-parser@0.16.0 require this older API line; the other resolved callers use 0.8.1." },
    { crate = "pastey@0.1.1", reason = "av-scenechange@0.14.1 require this older API line; the other resolved callers use 0.2.3." },
    { crate = "pem@3.0.6", reason = "rtc-dtls@0.21.1, rtc@0.21.1 require this older API line; the other resolved callers use 4.0.0." },
    { crate = "petgraph@0.4.13", reason = "servo-media-audio@0.2.0 require this older API line; the other resolved callers use 0.8.3." },
