[package]
name = "genet-host-api"
version = "0.2.0"
repository = "https://github.com/merely-made/genet"
publish = true
authors.workspace = true
license.workspace = true
edition.workspace = true

rust-version = "1.97.1"
description = "Raw engine host contracts for Genet: engine profiles, capabilities, resource fetching, and href resolution."
keywords = ["genet", "host", "engine", "contract"]
categories = ["gui", "api-bindings"]

[lib]
name = "genet_host_api"
path = "lib.rs"
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(llvm_pgo)'] }

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
