[package]
name = "netrender-smoke"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone project — intentionally NOT a genet workspace member.
# This example exercises the current Scene renderer without the Genet runtime.
# Its independent root must restate the maintained Classic source patches.
#
# Build:
#   cargo run --manifest-path examples/netrender_smoke/Cargo.toml
# from genet/ root.

[[bin]]
name = "netrender-smoke"
path = "src/main.rs"

[workspace]

[dependencies]
# netrender lives in the sibling netrender/ workspace. Git dep (not a path dep)
# so this standalone example clones-and-builds anywhere; a local netrender
# checkout is picked up via the gitignored `.cargo/config.toml` `paths` override.
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "46606610cd387e2e6956d8a3ebbcf442eab210d9" }
wgpu = "30"
pollster = "0.4"

# Match the root's Classic 0.11 provider and encoding/shader source. Patches
# are per-workspace-root and are not inherited from the Netrender dependency.
[patch.crates-io]
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a" }
