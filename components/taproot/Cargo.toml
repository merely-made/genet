[package]
# Named genet-probe until 2026-09-14.
name = "taproot"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
description = "The automatability substrate and scenario driver for genet apps: selectors over cambium ScriptedDom surfaces, the Automatable/Driveable seam, and the text Scenario that drives an app through them."
publish = true

[lib]
name = "taproot"
path = "lib.rs"

[dependencies]
genet-livery = { version = ">=0.0.1, <0.1", path = "../genet-livery" }
genet-scripted-dom = { version = "0.1.1", path = "../genet-scripted-dom" }
layout-dom-api = { version = "0.1.1", path = "../shared/layout-dom" }
