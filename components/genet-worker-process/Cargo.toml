[package]
name = "genet-worker-process"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "MPL-2.0"
publish = false

[[bin]]
name = "genet-worker-process"
path = "main.rs"

[dependencies]
script-runtime-api = { path = "../script-runtime-api" }
script-engine-api = { path = "../script-engine-api" }
script-engine-boa = { path = "../script-engine-boa" }

[target.'cfg(target_pointer_width = "64")'.dependencies]
script-engine-nova = { path = "../script-engine-nova" }

[dev-dependencies]
genet-host-api = { path = "../genet-host-api" }
genet-scripted = { path = "../genet-scripted", default-features = false }
