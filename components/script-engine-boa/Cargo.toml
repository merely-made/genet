# Boa backend for script-engine-api. Pure Rust, builds on all targets — it is the
# wasm32 scripting backend and compatibility artifact (Nova is 64-bit-target-only;
# see Appendix B in
# docs/2026-05-20_genet_script_engine_plan.md) and the native conformance oracle.
[package]
name = "script-engine-boa"
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "script_engine_boa"
path = "lib.rs"

[dependencies]
script-engine-api = { path = "../script-engine-api" }
boa_engine = { version = "=1.0.0-dev", git = "https://github.com/mark-ik/boa.git", rev = "494ae680a10704722df3c98335073245b7088a24", features = ["array-buffer-transfer"] }
boa_gc = { version = "=1.0.0-dev", git = "https://github.com/mark-ik/boa.git", rev = "494ae680a10704722df3c98335073245b7088a24" }
# Pin caller provenance and standard buffer transfer so fresh clones share the
# same realm and detachment rules. Transfer support does not enable Boa's broad
# experimental feature. The gitignored local config may
# redirect these sources to crates/boa; it is not part of the public contract.
# The maintained fork retains its 1.0.0-dev identity while incorporating stable
# v0.22. The exact prerelease version and revision define the host contract.

[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies]
# Browser host glue provides randomness and time on wasm32-unknown-unknown.
boa_engine = { version = "=1.0.0-dev", git = "https://github.com/mark-ik/boa.git", rev = "494ae680a10704722df3c98335073245b7088a24", features = ["js"] }
