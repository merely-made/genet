[package]
rust-version = "1.97.1"
name = "genet-livery"
version = "0.0.4"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
description = "Genet integration for the clean-room Livery CSS engine."
readme = "README.md"
publish = true

[features]
default = ["image-decode"]
# Decodes image bytes (`src/image_decode.rs`). Without it images get no natural
# size and are not painted, as for a failed decode.
image-decode = ["dep:image"]
parallel-text = ["dep:rayon"]
# Instantiates the retained pipeline once over `genet-scripted-dom`, upstream of
# every crate that drives a `LiveryDocument<ScriptedDom>`, so shared generics
# link one copy instead of one per sibling (`src/scripted_instance.rs`). The
# crates that use `ScriptedDom` turn it on; a graph without one needs no flag.
scripted-dom = ["dep:genet-scripted-dom"]
# Compiles table layout out (`display: table*` lays out as block, or as
# inline-block for `inline-table`). Off by default: every consumer keeps tables,
# including those that build with `default-features = false`. A consumer that
# never lays out a table turns it on to drop the table pipeline from its binary.
without-table-layout = []

[dependencies]
buckram = { version = "0.0.3", path = "../buckram" }
cssparser.workspace = true
data-url = { workspace = true }
genet-document-resources = { workspace = true }
euclid.workspace = true
genet-scripted-dom = { version = "0.1.1", path = "../genet-scripted-dom", optional = true }
image = { workspace = true, optional = true }
icu_properties.workspace = true
icu_segmenter.workspace = true
layout-dom-api = { version = "0.1.1", path = "../shared/layout-dom" }
livery = { version = "0.0.5", path = "../livery" }
paint_list_api.workspace = true
parley.workspace = true
serde.workspace = true
# Grows the layout recursion's stack on demand; see `layout::build_block::build_box`.
stacker.workspace = true
taffy = { package = "genet-taffy", version = "0.16.0", default-features = false, features = ["std", "block_layout", "float_layout", "flexbox", "grid", "calc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontsan.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
genet-scripted-dom = { version = "0.1.1", path = "../genet-scripted-dom" }
genet-static-dom = { version = "0.1.1", path = "../genet-static-dom" }
netrender = { workspace = true, features = ["vello-cpu"] }
paint_list_render.workspace = true
# Tests encode their PNG fixtures with it, with or without `image-decode`.
image = { workspace = true }
parley = { workspace = true, features = ["font-diagnostic"] }
read-fonts.workspace = true
# examples/capture_paint_corpus.rs — same encoding netrender's paint-list
# corpus stores fixtures in. Already in the lock via other members.
postcard = { version = "1", features = ["alloc"] }

[[test]]
name = "replaced_image"
required-features = ["image-decode"]

[lints]
workspace = true
